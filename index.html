function getRecentSwissPriceStats(){
const prices=[];

stations.forEach(station=>{
const price=Number(station.price95);
const updated=getPriceUpdate(station);
const age=getAgeDays(updated);
if(Number.isFinite(price)&&age!==null&&age<=3)
prices.push(price);
});

if(prices.length<2)return null;

const lowest=Math.min(...prices);
const highest=Math.max(...prices);

return{
lowest:lowest,
highest:highest,
saving:(highest-lowest)*50,
count:prices.length
};
}

.then(points=>{

/* GEOCODE */

function geocode(text){

const preset=
Object.keys(locations).find(
k=>locations[k].name.toLowerCase()===text.toLowerCase()
);

if(preset){

return Promise.resolve({
lat:locations[preset].lat,
lng:locations[preset].lng
});

}

return fetch(
"https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=ch&limit=1&q="+
encodeURIComponent(text),
{
headers:{
"Accept":"application/json"
}
}
)

.then(r=>r.json())

.then(data=>{

if(!data.length)
throw new Error(tm("locationNotFound")+": "+text);

return{
lat:Number(data[0].lat),
lng:Number(data[0].lon)
};

});

}


/* DISTANCE */

function distance(a,b,c,d){

const R=6371;

const p1=a*Math.PI/180;
const p2=c*Math.PI/180;

const dp=(c-a)*Math.PI/180;
const dl=(d-b)*Math.PI/180;

const x=
Math.sin(dp/2)**2+
Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;

return R*2*Math.atan2(
Math.sqrt(x),
Math.sqrt(1-x)
);

}


/* DISTANCE TO ROUTE */

function distanceToRoute(lat,lng){

if(!routeGeometry.length)
return Infinity;

let best=Infinity;

for(const p of routeGeometry){

const d=
distance(lat,lng,p.lat,p.lng);

if(d<best)
best=d;

}

return best;

}


/* PRICE UPDATE */

function getPriceUpdate(s){

if(
s.fuel95Raw &&
s.fuel95Raw.fiability &&
s.fuel95Raw.fiability.lastPriceUpdate
)
return s.fuel95Raw.fiability.lastPriceUpdate;

return null;

}


function getAgeDays(t){

if(!t)return null;

return Math.max(
0,
(Date.now()-new Date(t).getTime())/86400000
);

}


function formatDate(v){

if(!v)return"unknown";

return new Date(v).toLocaleString(
currentLanguage==="fr"?"fr-CH":
(currentLanguage==="de"?"de-CH":"en-GB"),
{
dateStyle:"short",
timeStyle:"short"
}
);

}

function renderResultsMap(){

if(typeof L==="undefined"||!displayedRows.length)return;

if(!resultsMap){

resultsMap=L.map("resultsMap");

resultsMap.createPane("routePane");
resultsMap.getPane("routePane").style.zIndex="450";

resultsMap.createPane("cheapestPane");
resultsMap.getPane("cheapestPane").style.zIndex="700";

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
maxZoom:19,
attribution:"&copy; OpenStreetMap contributors"
}
).addTo(resultsMap);

resultsMapLayer=L.layerGroup().addTo(resultsMap);
resultsRouteLayer=L.layerGroup().addTo(resultsMap);

}

resultsMapLayer.clearLayers();
resultsRouteLayer.clearLayers();

const top=
displayedRows.slice(0,10);

const lowestPrice=
Math.min(...top.map(x=>x.price));

const bounds=[];

if(
document.getElementById("mode").value==="route"&&
routeGeometry.length
){

const routePoints=
routeGeometry.map(p=>[p.lat,p.lng]);

L.polyline(routePoints,{
pane:"routePane",
color:"white",
weight:9,
opacity:.9
}).addTo(resultsRouteLayer);

L.polyline(routePoints,{
pane:"routePane",
color:"#ef6c00",
weight:5,
opacity:1
}).addTo(resultsRouteLayer);

routePoints.forEach(point=>bounds.push(point));

}

top.forEach((x,i)=>{

const s=x.station;
const cheapest=x.price===lowestPrice;

const icon=L.divIcon({
className:"price-map-icon",
html:
"<div class='price-map-label"+
(cheapest?" cheapest":"")+
"'>"+x.price.toFixed(3)+
"<span>#"+(i+1)+"</span></div>",
iconSize:[62,38],
iconAnchor:[31,19]
});

const marker=L.marker(
[Number(s.lat),Number(s.lng)],
{
icon:icon,
pane:cheapest?"cheapestPane":"markerPane",
zIndexOffset:cheapest?1000:0
}
).addTo(resultsMapLayer);

marker.bindPopup(
"<b>"+escapeHTML(s.name||"Unknown")+"</b><br>"+
escapeHTML(s.address||"")+"<br>"+
"<span class='map-popup-price'>"+x.price.toFixed(3)+" CHF/L</span><br>"+
x.distance.toFixed(1)+" "+tr("fromStart")+"<br>"+
"<a href='"+navigateLink(s)+"' target='_blank' rel='noopener'>"+tr("navigate")+"</a>"
);

bounds.push([Number(s.lat),Number(s.lng)]);

});

setTimeout(()=>{
resultsMap.invalidateSize();
if(bounds.length===1)resultsMap.setView(bounds[0],13);
else resultsMap.fitBounds(bounds,{padding:[35,35]});
},0);

}

function showStations(){

if(!currentPosition){

updateSavingsButton(false);
displayedRows=[];
updateMapButton(false);
closeResultsMap();

"<div class='card empty'>"+tm("selectLocation")+"</div>";

return;

}

const mode=
document.getElementById("mode").value;

const radius=
Number(document.getElementById("radius").value);

const corridor=
Number(document.getElementById("corridor").value);

const sort=
document.getElementById("sort").value;

const brand=
document.getElementById("brand").value;

const maxAge=
document.getElementById("age").value;

let rows=[];

stations.forEach(s=>{

if(
brand!=="all" &&
s.brand!==brand
)return;

const lat=Number(s.lat);
const lng=Number(s.lng);
const price=Number(s.price95);

if(
!Number.isFinite(lat)||
!Number.isFinite(lng)||
!Number.isFinite(price)
)return;

const dist=
distance(
currentPosition.lat,
currentPosition.lng,
lat,
lng
);

let routeDist=null;

if(mode==="near"){

if(dist>radius)return;

}else{

if(!routeGeometry.length)return;

routeDist=
distanceToRoute(lat,lng);

if(routeDist>corridor)return;

}

const update=getPriceUpdate(s);

const updateTime=
update?
new Date(update).getTime():
null;

const age=getAgeDays(update);

if(
maxAge!=="all" &&
(
age===null||
age>Number(maxAge)
)
)
return;


/*
Journey score:

Cheap petrol helps.
Small route detour helps.

Price component is normalised later.
*/

rows.push({
station:s,
distance:dist,
routeDistance:routeDist,
price,
update,
updateTime,
age
});

});


/* SCORE */

if(mode==="route"&&rows.length){

const prices=rows.map(x=>x.price);
const minPrice=Math.min(...prices);
const maxPrice=Math.max(...prices);

rows.forEach(x=>{

const priceRange=
maxPrice-minPrice||0.001;

const priceScore=
(x.price-minPrice)/priceRange;

const detourScore=
Math.min(x.routeDistance,20)/20;

/*
Price 60%
Detour 40%
*/

x.score=
priceScore*0.60+
detourScore*0.40;

});

}


/* SORT */

if(mode==="route"){

if(sort==="price"){

rows.sort((a,b)=>
a.price-b.price
);

}else if(sort==="distance"){

rows.sort((a,b)=>
a.routeDistance-b.routeDistance
);

}else{

rows.sort((a,b)=>
a.score-b.score
);

}

routeResults=rows;

document.getElementById("routeActions").style.display=
rows.length?"block":"none";

}else{

if(sort==="price"){

rows.sort((a,b)=>
a.price-b.price||
a.distance-b.distance
);

}else{

rows.sort((a,b)=>
a.distance-b.distance
);

}

routeResults=rows;

document.getElementById("routeActions").style.display="none";

}


/* MAP DATA */

displayedRows=rows;
updateMapButton(rows.length>0);

if(
document.getElementById("mapOverlay").style.display==="block"
){
renderResultsMap();
}


/* OUTPUT */

updateSavingsButton(rows.length>0);

let html=
"<h2>"+
rows.length+
(mode==="route"?
" "+tr("stationsRoute"):
" "+tr("stations"))+
"</h2>";

if(rows.length&&showSavings){

const filteredPrices=
rows.map(x=>x.price);

const lowestPrice=
Math.min(...filteredPrices);

const highestPrice=
Math.max(...filteredPrices);

const priceDelta=
highestPrice-lowestPrice;

const fiftyLitreSaving=
priceDelta*50;

html+=
"<div class='card'>"+
"⛽ <b>"+tr("filteredRange")+"</b><br>"+
tr("cheapest")+": <b>"+lowestPrice.toFixed(3)+" CHF/L</b><br>"+
tr("mostExpensive")+": <b>"+highestPrice.toFixed(3)+" CHF/L</b><br>"+
tr("difference")+": <b>"+priceDelta.toFixed(3)+" CHF/L</b><br>"+
tr("saving50")+": <b>CHF "+
fiftyLitreSaving.toFixed(2)+"</b>"+
"</div>";

}

if(mode==="route"&&rows.length){

html+=
"<div class='card'>"+
"⭐ <b>"+tm("bestExplanation")+"</b>"+
"</div>";

}

if(!rows.length){

html+=
"<div class='card empty'>"+
tr("noMatch")+
"</div>";

}

const cheapest=
rows.length?
Math.min(...rows.map(x=>x.price)):
null;


rows.forEach((x,i)=>{

const s=x.station;

let ageText=tr("unknown");
let ageClass="warning";

if(x.update){

if(x.age<1){

ageText=tr("updatedToday");
ageClass="recent";

}else{

const d=Math.floor(x.age);

ageText=
d+
" "+(d===1?tr("day"):tr("oldDays"));

ageClass=
d>=7?"old":"warning";

}

}

html+=
"<div class='card'>"+

"<div class='rank'>#"+(i+1)+"</div>"+

"<div class='station'>"+
escapeHTML(s.name||"Unknown")+
"</div>"+

"<div class='brand'>"+
escapeHTML(s.brand||"")+
"</div>"+

"<div class='address'>"+
escapeHTML(s.address||"")+
"</div>"+

"<div class='distance'>"+
x.distance.toFixed(1)+
" "+tr("fromStart")+
"</div>";

if(mode==="route"){

html+=
"<div class='detour'>"+
"↪ "+tr("routeDistance")+": "+
x.routeDistance.toFixed(1)+
" km"+
"</div>";

}

html+=

"<div class='price"+
(x.price===cheapest?" cheapest":"")+
"'>"+
x.price.toFixed(3)+
" CHF/L"+
"</div>"+

"<div class='price-label'>"+
tm("fuel95")+
(x.price===cheapest?
" • "+tm("cheapestTag"):
"")+
"</div>"+

"<hr>"+

"<div class='price-update'>"+
"<b>"+tr("priceUpdated")+":</b> "+
(x.update?
formatDate(x.update):
"Unknown")+
"<br>"+
"<span class='"+ageClass+"'>"+
ageText+
"</span>"+
"</div>"+

"<div class='station-buttons'>"+

"<a target='_blank' href='"+
mapsLink(s)+
"'>🗺️ "+tr("map")+"</a>"+

"<a class='navigate' target='_blank' href='"+
navigateLink(s)+
"'>🚗 "+tr("navigate")+"</a>"+

"</div>"+

"</div>";

});

document.getElementById("results").innerHTML=html;

}

function clearFilters(){

document.getElementById("age").value="3";
document.getElementById("brand").value="all";
document.getElementById("radius").value="25";
document.getElementById("corridor").value="5";

/* ESCAPE */

function escapeHTML(v){

return String(v)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

if(
key==="resetFilters"&&
document.getElementById("mode").value==="route"&&
routeGeometry.length
){
key="resetRoute";
}

if(!controlHelp[key])return;

document.getElementById("helpTitle").innerText=tr("help");

(localizedHelp[currentLanguage]?.[key]||controlHelp[key]);

document.getElementById("helpOverlay").style.display="flex";

}

document.getElementById("helpOverlay").style.display="none";

function applyReviewLanguage(){
document.getElementById("reviewsButton").textContent="⭐ "+rt("button")+(approvedReviews.length?" ("+approvedReviews.length+")":"");
document.getElementById("reviewTitle").textContent=rt("title");
document.getElementById("reviewCloseButton").textContent=rt("close");
document.getElementById("reviewFormTitle").textContent=rt("formTitle");
document.getElementById("ratingLabel").textContent=rt("rating");
document.getElementById("reviewNameLabel").textContent=rt("name");
document.getElementById("reviewCommentLabel").textContent=rt("comment");
document.getElementById("reviewSubmit").textContent=rt("submit");
renderReviews();
}

function renderReviewStars(){
const box=document.getElementById("reviewStars");
box.replaceChildren();
for(let value=1;value<=5;value++){
const star=document.createElement("span");
star.textContent="★";
star.className=value<=selectedReviewRating?"selected":"";
star.setAttribute("role","radio");
star.setAttribute("aria-checked",value===selectedReviewRating?"true":"false");
star.setAttribute("aria-label",value+" / 5");
star.tabIndex=0;
star.onclick=()=>setReviewRating(value);
star.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();setReviewRating(value);}};
box.appendChild(star);
}
}

function setReviewRating(value){
selectedReviewRating=value;
document.getElementById("reviewRating").value=String(value);
renderReviewStars();
}

function renderReviews(loadError=false){
const summary=document.getElementById("reviewSummary");
const list=document.getElementById("reviewList");
if(!summary||!list)return;
summary.replaceChildren();
list.replaceChildren();
if(loadError){summary.textContent=rt("loadError");return;}
if(!approvedReviews.length){summary.textContent=rt("none");return;}
const average=approvedReviews.reduce((sum,item)=>sum+Number(item.rating||0),0)/approvedReviews.length;
const averageLine=document.createElement("div");
averageLine.className="review-average";
averageLine.textContent="★ "+average.toFixed(1)+" / 5";
const count=document.createElement("div");
count.textContent=approvedReviews.length+" "+rt("reviews");
summary.append(averageLine,count);
approvedReviews.forEach(item=>{
const card=document.createElement("div");card.className="review-item";
const head=document.createElement("div");head.className="review-item-head";
const who=document.createElement("b");who.textContent=(item.display_name||"").trim()||rt("anonymous");
const date=document.createElement("span");
try{date.textContent=new Intl.DateTimeFormat(currentLanguage==="fr"?"fr-CH":currentLanguage==="de"?"de-CH":"en-GB",{dateStyle:"medium"}).format(new Date(item.created_at));}catch(e){date.textContent="";}
head.append(who,date);
const stars=document.createElement("div");stars.className="review-item-stars";stars.textContent="★".repeat(Number(item.rating)||0)+"☆".repeat(5-(Number(item.rating)||0));
const comment=document.createElement("div");comment.className="review-comment";comment.textContent=item.comment||"";
card.append(head,stars,comment);list.appendChild(card);
});
}

async function loadReviews(){
const summary=document.getElementById("reviewSummary");
summary.textContent=rt("loading");
try{
const response=await fetch(SUPABASE_URL+"/rest/v1/reviews?select=id,created_at,display_name,rating,comment,language&approved=eq.true&order=created_at.desc",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
if(!response.ok)throw new Error("HTTP "+response.status);
approvedReviews=await response.json();
applyReviewLanguage();
}catch(error){console.error("Review load error",error);renderReviews(true);}
}

function openReviews(){
document.getElementById("reviewOverlay").style.display="flex";
applyReviewLanguage();
loadReviews();
}

function closeReviews(){document.getElementById("reviewOverlay").style.display="none";}

async function submitReview(event){
event.preventDefault();
const message=document.getElementById("reviewMessage");
message.className="review-message";
if(document.getElementById("reviewWebsite").value)return;
const comment=document.getElementById("reviewComment").value.trim();
if(selectedReviewRating<1){message.textContent=rt("chooseRating");message.classList.add("error");return;}
if(comment.length<3){message.textContent=rt("shortComment");message.classList.add("error");return;}
const button=document.getElementById("reviewSubmit");button.disabled=true;button.textContent=rt("sending");
try{
const response=await fetch(SUPABASE_URL+"/rest/v1/reviews",{method:"POST",headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify({display_name:document.getElementById("reviewName").value.trim()||null,rating:selectedReviewRating,comment,language:currentLanguage})});
if(!response.ok)throw new Error("HTTP "+response.status);
document.getElementById("reviewForm").reset();setReviewRating(0);
message.textContent=rt("thanks");message.className="review-message success";
await loadReviews();
}catch(error){console.error("Review submit error",error);message.textContent=rt("error");message.className="review-message error";}
finally{button.disabled=false;button.textContent=rt("submit");}
}

if(!translations[currentLanguage])currentLanguage="fr";
document.getElementById("sort").value="price";
document.getElementById("status").innerText=tr("loading");
document.getElementById("locationInfo").innerText=tr("waiting");
renderReviewStars();
applyLanguage();
loadReviews();
loadData();
